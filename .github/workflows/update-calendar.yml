name: Update RKLB calendar

on:
  workflow_dispatch:
  schedule:
    # 每天 13:17 UTC 自动运行
    - cron: "17 13 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-rklb-calendar
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Refresh calendar
        run: python update_calendar.py

      - name: Commit updated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache_ir_events.json docs/
          if git diff --cached --quiet; then
            echo "No calendar changes to commit."
          else
            git commit -m "chore: update RKLB calendar"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
